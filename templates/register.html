{% extends 'base.html' %}

{% block title %}
Register | Email Upload Tool
{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-xl-5 col-lg-6 col-md-8 col-sm-10">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            <!-- Decorative colored bar on top -->
            <div style="height: 5px; background: linear-gradient(90deg, #10b981 0%, #34d399 100%);"></div>
            
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 72px; height: 72px; background-color: rgba(16, 185, 129, 0.08) !important;">
                        <i class="bi bi-person-plus text-success" style="font-size: 32px;"></i>
                    </div>
                    <h3 class="fw-bold tracking-tight text-dark-slate mb-1">
                        Create an account
                    </h3>
                    <p class="text-muted small">
                        Start sending personalized bulk emails
                    </p>
                </div>

                <form method="POST" novalidate>
                    {% csrf_token %}

                    <!-- Username -->
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">
                            Username
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i class="bi bi-person"></i>
                            </span>
                            <input
                                type="text"
                                name="username"
                                class="form-control border-start-0 bg-light"
                                placeholder="Choose a username"
                                required>
                        </div>
                    </div>

                    <!-- Email Address -->
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">
                            Email Address
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input
                                type="email"
                                name="email"
                                class="form-control border-start-0 bg-light"
                                placeholder="Enter your email address"
                                required>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">
                            Password
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input
                                type="password"
                                name="password"
                                class="form-control border-start-0 bg-light"
                                placeholder="Create a strong password"
                                required>
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-secondary">
                            Confirm Password
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i class="bi bi-shield-lock"></i>
                            </span>
                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control border-start-0 bg-light"
                                placeholder="Repeat your password"
                                required>
                        </div>
                    </div>

                    <!-- Submit -->
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success py-2.5 rounded-3 border-0" style="background-color: var(--success-color);">
                            <i class="bi bi-person-check me-2"></i>
                            Register Account
                        </button>
                    </div>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                    <p class="mb-0 text-muted small">
                        Already have an account? 
                        <a href="{% url 'login' %}" class="text-decoration-none fw-semibold text-primary">
                            Sign In
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
