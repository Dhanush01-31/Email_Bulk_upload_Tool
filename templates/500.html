{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="text-center py-5" style="min-height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">

    <h1 class="fw-bold text-primary" style="font-size: 6rem;">500</h1>

    <h3 class="fw-bold mb-2" style="color: #1e293b;">Something Went Wrong</h3>

    <p class="text-muted">
        We had a problem on our side. Please try again in a few minutes.
    </p>

    <a href="{% url 'dashboard' %}" class="btn btn-primary mt-3 rounded-3 px-4 py-2">
        <i class="bi bi-arrow-left me-2"></i>Back to Dashboard
    </a>

</div>
{% endblock %}
