{% extends 'base.html' %}

{% block title %}
Login | Email Upload Tool
{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-xl-4 col-lg-5 col-md-7 col-sm-9">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            <!-- Decorative colored bar on top -->
            <div style="height: 5px; background: linear-gradient(90deg, var(--primary) 0%, #818cf8 100%);"></div>
            
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle mb-3" style="width: 72px; height: 72px; background-color: var(--primary-soft) !important;">
                        <i class="bi bi-envelope-open-fill text-primary" style="font-size: 32px;"></i>
                    </div>
                    <h3 class="fw-bold tracking-tight text-dark-slate mb-1">
                        Welcome back
                    </h3>
                    <p class="text-muted small">
                        Access your bulk email campaign suite
                    </p>
                </div>

                <form method="POST" novalidate>
                    {% csrf_token %}
                    
                    {% if next %}
                        <input type="hidden" name="next" value="{{ next }}">
                    {% endif %}

                    <!-- Username -->
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">
                            Username
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i class="bi bi-person"></i>
                            </span>
                            <input
                                type="text"
                                name="username"
                                class="form-control border-start-0 bg-light"
                                placeholder="Enter your username"
                                required>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label small fw-semibold text-secondary mb-0">
                                Password
                            </label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input
                                type="password"
                                name="password"
                                class="form-control border-start-0 bg-light"
                                placeholder="Enter your password"
                                required>
                        </div>
                    </div>

                    <!-- Submit -->
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary py-2.5 rounded-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i>
                            Sign In
                        </button>
                    </div>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                    <p class="mb-0 text-muted small">
                        Don't have an account? 
                        <a href="{% url 'register' %}" class="text-decoration-none fw-semibold text-primary">
                            Create an account
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
