{% extends 'base.html' %}

{% block title %}
Login | Email Upload Tool
{% endblock %}

{% block content %}

<div class="row justify-content-center align-items-center" style="min-height: 80vh;">

    <div class="col-lg-5 col-md-7">

        <div class="card shadow-lg border-0 rounded-4">

            <div class="card-body p-5">

                <div class="text-center mb-4">

                    <div class="mb-3">
                        <i class="bi bi-envelope-paper-fill text-primary" style="font-size: 60px;"></i>
                    </div>

                    <h2>
                        Welcome Back
                    </h2>

                    <p class="text-muted">
                        Login to your Email Upload Tool account
                    </p>

                </div>

                <form method="POST">

                    {% csrf_token %}

                    <!-- Username -->
                    {% if next %}
                        <input type="hidden" name="next" value="{{ next }}">
                    {% endif %}
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Username
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-person-fill"></i>
                            </span>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter your username"
                                required>

                        </div>

                    </div>

                    <!-- Password -->

                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            Password
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-lock-fill"></i>
                            </span>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter your password"
                                required>

                        </div>

                    </div>

                    <div class="d-grid">

                        <button type="submit"
                                class="btn btn-primary btn-lg">

                            <i class="bi bi-box-arrow-in-right"></i>
                            Login

                        </button>

                    </div>

                </form>

                <hr class="my-4">

                <div class="text-center">

                    <p class="mb-0">

                        Don't have an account?

                        <a href="{% url 'register' %}"
                           class="text-decoration-none fw-semibold">

                            Register

                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
