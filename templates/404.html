{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="text-center py-5" style="min-height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">

    <h1 class="fw-bold text-primary" style="font-size: 6rem;">404</h1>

    <h3 class="fw-bold mb-2" style="color: #1e293b;">Page Not Found</h3>

    <p class="text-muted">
        Sorry, the page you are looking for doesn't exist.
    </p>

    <a href="{% url 'dashboard' %}" class="btn btn-primary mt-3 rounded-3 px-4 py-2">
        <i class="bi bi-arrow-left me-2"></i>Back to Dashboard
    </a>

</div>
{% endblock %}
