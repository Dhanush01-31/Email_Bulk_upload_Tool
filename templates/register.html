{% extends 'base.html' %}

{% block title %}
Register | Email Upload Tool
{% endblock %}

{% block content %}

<div class="row justify-content-center align-items-center" style="min-height: 80vh;">

    <div class="col-lg-6 col-md-8">

        <div class="card shadow-lg border-0 rounded-4">

            <div class="card-body p-5">

                <div class="text-center mb-4">

                    <div class="mb-3">
                        <i class="bi bi-person-plus-fill text-success" style="font-size: 60px;"></i>
                    </div>

                    <h2 class="fw-bold">
                        Create an Account
                    </h2>

                    <p class="text-muted">
                        Register to start sending personalized bulk emails.
                    </p>

                </div>

                <form method="POST">

                    {% csrf_token %}

                    <!-- Username -->

                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Username
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-person-fill"></i>
                            </span>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter your username"
                                required>

                        </div>

                    </div>

                    <!-- Email -->

                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Email Address
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-envelope-fill"></i>
                            </span>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required>

                        </div>

                    </div>

                    <!-- Password -->

                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Password
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-lock-fill"></i>
                            </span>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Create a password"
                                required>

                        </div>

                    </div>

                    <!-- Confirm Password -->

                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            Confirm Password
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-shield-lock-fill"></i>
                            </span>

                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control"
                                placeholder="Confirm your password"
                                required>

                        </div>

                    </div>

                    <!-- Register Button -->

                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-success btn-lg">

                            <i class="bi bi-person-check-fill"></i>

                            Register

                        </button>

                    </div>

                </form>

                <hr class="my-4">

                <div class="text-center">

                    <p class="mb-0">

                        Already have an account?

                        <a
                            href="{% url 'login' %}"
                            class="text-decoration-none fw-semibold">

                            Login

                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
